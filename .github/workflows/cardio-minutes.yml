name: cardio-minutes

on:
  schedule:
    - cron: "20 9 * * *"   # daily 9:20 UTC = 5:20 AM EDT / 4:20 AM EST
  workflow_dispatch:        # manual runs from the Actions tab
    inputs:
      fetch_limit:
        description: "Recent activities to fetch (set 300 for backfill)"
        required: false
        default: "30"

permissions:
  contents: write

concurrency:
  group: cardio-minutes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install garminconnect

      - name: Update cardio-minutes.csv
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          ACTIVITY_FETCH_LIMIT: ${{ inputs.fetch_limit || '30' }}
        run: python cardio-minutes-pipeline/cardio_minutes.py

      - name: Commit if changed
        run: |
          git add cardio-minutes.csv
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git config user.name "cardio-minutes-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "cardio-minutes: update $(date -u +%F)"
            git pull --rebase --autostash origin main
            git push
          fi

      # Post Karvonen zone records for new outdoor activities (walk / run /
      # ride / hike) into the workout log. Indoor types and anything that
      # overlaps a hand-logged session are skipped and left for manual review.
      - name: Post zone records to workout log
        run: |
          RHR=$(python -c "import json;print(json.load(open('cardio-minutes-pipeline/zones.json'))['rhr'])")
          HRMAX=$(python -c "import json;print(json.load(open('cardio-minutes-pipeline/zones.json'))['hrmax'])")
          DAYS=$(python -c "import json;print(json.load(open('cardio-minutes-pipeline/zones.json')).get('sinceDays',14))")
          SINCE=$(date -u -d "-$DAYS days" +%F)
          python cardio-minutes-pipeline/post_zone_records.py \
            --cardio cardio-minutes.csv --log-json workout-log.json --log-csv workout-log.csv \
            --garmin garmin-recent.json --rhr "$RHR" --hrmax "$HRMAX" --since "$SINCE" --out-dir .

      - name: Commit zone records if any
        run: |
          git add workout-log.json workout-log.csv
          if git diff --cached --quiet; then
            echo "No new zone records."
            exit 0
          fi
          git config user.name "cardio-minutes-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Post cardio zone records (auto) $(date -u +%F)"
          git pull --rebase --autostash origin main
          git push
