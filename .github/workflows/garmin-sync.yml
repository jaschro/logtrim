name: Garmin Sync

on:
  schedule:
    - cron: '0 */3 * * *'  # every 3 hours
  workflow_dispatch:         # allow manual trigger from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed to commit garmin-recent.json back to the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install garminconnect
        run: pip install garminconnect --quiet

      - name: Run Garmin sync
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          GARMIN_DISPLAY_NAME: ${{ secrets.GARMIN_DISPLAY_NAME }}
        run: python scripts/garmin_sync.py

      - name: Commit updated Garmin data
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f garmin-recent.json
          git diff --staged --quiet || git commit -m "Update Garmin data [skip ci]"
          git pull --rebase -X theirs
          git push
